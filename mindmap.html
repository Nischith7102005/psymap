<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMap - Brain Map Visualizer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        h1 { font-size: 2.5em; background: linear-gradient(90deg, #00d9ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #888; margin-top: 10px; }
        
        .input-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .input-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        input[type="text"] {
            flex: 1;
            min-width: 300px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        input[type="text"]::placeholder { color: #888; }
        input[type="file"] { display: none; }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(90deg, #00d9ff, #00ff88); color: #1a1a2e; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,217,255,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        
        .viz-container {
            background: rgba(255,255,255,0.02);
            border-radius: 15px;
            padding: 20px;
            position: relative;
        }
        #brainmap { width: 100%; height: 600px; }
        
        .insights-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .insight-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid;
        }
        .insight-card h3 { margin-bottom: 15px; font-size: 1.1em; }
        .insight-card ul { list-style: none; }
        .insight-card li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9em;
            color: #ccc;
        }
        .insight-card li:last-child { border-bottom: none; }
        
        .tag {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin: 3px;
            background: rgba(255,255,255,0.1);
        }
        
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .node-label { font-size: 12px; fill: #fff; pointer-events: none; }
        .link { stroke-opacity: 0.6; }
        
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; color: #00d9ff; }
        .stat-label { color: #888; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 MindMap</h1>
            <p class="subtitle">Transform your content into an interactive brain map of interests & psychology</p>
        </header>
        
        <div class="input-section">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Enter a web URL (e.g., https://example.com/article)">
                <button class="btn-primary" onclick="processURL()">Add URL</button>
            </div>
            <div class="input-group">
                <label class="btn-secondary" style="padding: 12px 25px; border-radius: 25px; cursor: pointer;">
                    📄 Upload PDF
                    <input type="file" id="pdfInput" accept=".pdf" onchange="processPDF(this)">
                </label>
                <button class="btn-secondary" onclick="clearAll()">Clear All</button>
            </div>
            <div id="sourceList" style="margin-top: 15px; font-size: 0.9em; color: #888;"></div>
        </div>
        
        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="statSources">0</div>
                <div class="stat-label">Sources</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statConcepts">0</div>
                <div class="stat-label">Concepts</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statThemes">0</div>
                <div class="stat-label">Themes</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statPsych">0%</div>
                <div class="stat-label">Dominant Trait</div>
            </div>
        </div>
        
        <div class="viz-container">
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Analyzing content...</p>
            </div>
            <svg id="brainmap"></svg>
        </div>
        
        <div class="insights-panel" id="insightsPanel" style="display: none;">
            <div class="insight-card" style="border-color: #00d9ff;">
                <h3>🎯 Primary Interests</h3>
                <ul id="interestsList"></ul>
            </div>
            <div class="insight-card" style="border-color: #00ff88;">
                <h3>🔗 Connected Themes</h3>
                <div id="themesList"></div>
            </div>
            <div class="insight-card" style="border-color: #ff6b6b;">
                <h3>🧠 Psychological Indicators</h3>
                <ul id="psychList"></ul>
            </div>
            <div class="insight-card" style="border-color: #ffd93d;">
                <h3>📊 Content Patterns</h3>
                <ul id="patternsList"></ul>
            </div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>
    
    <script>
        // Initialize PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        // State management
        let sources = [];
        let allText = '';
        let graphData = { nodes: [], links: [] };
        let simulation = null;
        
        // Psychological pattern dictionaries
        const psychPatterns = {
            analytical: ['analyze', 'research', 'study', 'data', 'evidence', 'logic', 'systematic', 'method', 'framework', 'model'],
            creative: ['imagine', 'create', 'innovate', 'artistic', 'design', 'vision', 'original', 'express', 'intuitive', 'metaphor'],
            practical: ['implement', 'execute', 'action', 'results', 'efficient', 'practical', 'apply', 'solve', 'build', 'optimize'],
            social: ['community', 'collaborate', 'team', 'share', 'connect', 'relationship', 'together', 'support', 'network', 'communicate'],
            ambitious: ['achieve', 'success', 'goal', 'leadership', 'growth', 'excel', 'ambitious', 'drive', 'accomplish', 'mastery'],
            curious: ['explore', 'discover', 'learn', 'question', 'wonder', 'investigate', 'understand', 'knowledge', 'insight', 'reveal']
        };
        
        // Theme categories
        const themeCategories = {
            technology: ['ai', 'machine learning', 'software', 'digital', 'automation', 'algorithm', 'data', 'cloud', 'blockchain', 'cybersecurity'],
            science: ['research', 'discovery', 'experiment', 'hypothesis', 'physics', 'biology', 'chemistry', 'quantum', 'evolution', 'genetics'],
            business: ['strategy', 'market', 'investment', 'startup', 'entrepreneur', 'finance', 'revenue', 'growth', 'innovation', 'leadership'],
            health: ['wellness', 'fitness', 'nutrition', 'mental health', 'medicine', 'therapy', 'lifestyle', 'exercise', 'diet', 'mindfulness'],
            arts: ['design', 'creative', 'art', 'music', 'literature', 'visual', 'expression', 'culture', 'aesthetic', 'craft'],
            society: ['community', 'policy', 'social', 'justice', 'equality', 'environment', 'sustainability', 'education', 'culture', 'democracy']
        };
        
        async function processURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            
            showLoading(true);
            
            try {
                // Use a CORS proxy for demo purposes (in production, use a backend)
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error('Failed to fetch URL');
                
                const html = await response.text();
                const text = extractTextFromHTML(html);
                
                if (text.length < 100) throw new Error('Insufficient content extracted');
                
                sources.push({ type: 'url', url: url, text: text, title: url });
                allText += ' ' + text;
                
                updateSourceList();
                analyzeContent();
            } catch (error) {
                alert('Error fetching URL: ' + error.message + '\n\nNote: Some websites block direct access. Try uploading a PDF instead.');
            } finally {
                showLoading(false);
                document.getElementById('urlInput').value = '';
            }
        }
        
        async function processPDF(input) {
            const file = input.files[0];
            if (!file) return;
            
            showLoading(true);
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                
                let fullText = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += ' ' + pageText;
                }
                
                if (fullText.length < 100) throw new Error('Insufficient content in PDF');
                
                sources.push({ type: 'pdf', name: file.name, text: fullText, title: file.name });
                allText += ' ' + fullText;
                
                updateSourceList();
                analyzeContent();
            } catch (error) {
                alert('Error processing PDF: ' + error.message);
            } finally {
                showLoading(false);
                input.value = '';
            }
        }
        
        function extractTextFromHTML(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            
            // Remove scripts, styles, and other non-content elements
            temp.querySelectorAll('script, style, nav, footer, header, aside').forEach(el => el.remove());
            
            // Get text from main content areas first
            const mainContent = temp.querySelector('main, article, [role="main"], .content, .article');
            const text = (mainContent || temp).textContent;
            
            // Clean up whitespace
            return text.replace(/\s+/g, ' ').trim();
        }
        
        function analyzeContent() {
            if (!allText.trim()) return;
            
            const text = allText.toLowerCase();
            const words = text.split(/\W+/).filter(w => w.length > 3);
            
            // Count word frequencies
            const wordFreq = {};
            words.forEach(word => {
                wordFreq[word] = (wordFreq[word] || 0) + 1;
            });
            
            // Filter stopwords
            const stopwords = new Set(['the', 'and', 'this', 'that', 'with', 'for', 'are', 'was', 'have', 'has', 'had', 'been', 'were', 'would', 'could', 'should', 'may', 'might', 'must', 'shall', 'can', 'need', 'dare', 'ought', 'used', 'from', 'into', 'about', 'through', 'between', 'against', 'before', 'after', 'above', 'below', 'under', 'over', 'out', 'in', 'on', 'at', 'by', 'of', 'as', 'to', 'is', 'it', 'be', 'or', 'an', 'but', 'if', 'so', 'than', 'too', 'very', 'just', 'also', 'only', 'other', 'new', 'some', 'these', 'those', 'which', 'who', 'whom', 'what', 'where', 'when', 'why', 'how', 'all', 'each', 'every', 'both', 'few', 'more', 'most', 'such', 'no', 'nor', 'not', 'own', 'same', 'any', 'there', 'their', 'they', 'we', 'you', 'your', 'our', 'its', 'his', 'her', 'one', 'two', 'first', 'last', 'long', 'great', 'little', 'while', 'time', 'year', 'people', 'way', 'day', 'man', 'thing', 'woman', 'life', 'child', 'world', 'school', 'state', 'family', 'student', 'group', 'country', 'problem', 'hand', 'part', 'place', 'case', 'week', 'company', 'system', 'program', 'question', 'work', 'government', 'number', 'night', 'point', 'home', 'water', 'room', 'mother', 'area', 'money', 'story', 'fact', 'month', 'lot', 'right', 'idea', 'body', 'information', 'back', 'parent', 'face', 'others', 'level', 'office', 'door', 'health', 'person', 'art', 'war', 'history', 'party', 'result', 'change', 'morning', 'reason', 'research', 'girl', 'guy', 'moment', 'air', 'teacher', 'force', 'education']);
            
            // Extract key concepts
            const concepts = Object.entries(wordFreq)
                .filter(([word]) => !stopwords.has(word))
                .sort((a, b) => b[1] - a[1])
                .slice(0, 30);
            
            // Identify themes
            const themes = {};
            Object.entries(themeCategories).forEach(([category, keywords]) => {
                const score = keywords.reduce((sum, keyword) => {
                    if (text.includes(keyword)) {
                        const freq = wordFreq[keyword] || 0;
                        return sum + freq + 1;
                    }
                    return sum;
                }, 0);
                if (score > 0) themes[category] = score;
            });
            
            // Analyze psychological patterns
            const psychScores = {};
            Object.entries(psychPatterns).forEach(([trait, keywords]) => {
                const score = keywords.reduce((sum, keyword) => {
                    if (text.includes(keyword)) {
                        const freq = wordFreq[keyword] || 0;
                        return sum + freq + 1;
                    }
                    return sum;
                }, 0);
                if (score > 0) psychScores[trait] = score;
            });
            
            // Build graph data
            buildGraph(concepts, themes, psychScores);
            
            // Update visualizations
            updateStats(sources.length, concepts.length, Object.keys(themes).length, psychScores);
            updateInsights(concepts, themes, psychScores, wordFreq);
            renderBrainMap();
        }
        
        function buildGraph(concepts, themes, psychScores) {
            graphData = { nodes: [], links: [] };
            
            // Add central node
            graphData.nodes.push({
                id: 'center',
                label: 'Your Mind',
                type: 'center',
                value: 50
            });
            
            // Add theme nodes
            const themeColors = { technology: '#00d9ff', science: '#00ff88', business: '#ffd93d', health: '#ff6b6b', arts: '#ff85c0', society: '#a855f7' };
            
            Object.entries(themes).forEach(([theme, score]) => {
                graphData.nodes.push({
                    id: `theme_${theme}`,
                    label: theme.charAt(0).toUpperCase() + theme.slice(1),
                    type: 'theme',
                    value: Math.min(score * 2, 40),
                    color: themeColors[theme] || '#888'
                });
                
                graphData.links.push({
                    source: 'center',
                    target: `theme_${theme}`,
                    value: score
                });
            });
            
            // Add concept nodes connected to relevant themes
            concepts.slice(0, 20).forEach(([concept, freq]) => {
                // Find best matching theme
                let bestTheme = null;
                let bestScore = 0;
                
                Object.entries(themeCategories).forEach(([theme, keywords]) => {
                    const score = keywords.filter(kw => concept.includes(kw) || kw.includes(concept)).length;
                    if (score > bestScore) {
                        bestScore = score;
                        bestTheme = theme;
                    }
                });
                
                const nodeId = `concept_${concept}`;
                const themeId = bestTheme ? `theme_${bestTheme}` : 'center';
                
                graphData.nodes.push({
                    id: nodeId,
                    label: concept,
                    type: 'concept',
                    value: Math.min(freq * 1.5, 25),
                    color: bestTheme ? (themeColors[bestTheme] || '#888') : '#888'
                });
                
                graphData.links.push({
                    source: themeId,
                    target: nodeId,
                    value: freq
                });
            });
            
            // Add psychological trait nodes
            const psychColors = { analytical: '#4ecdc4', creative: '#ff6b6b', practical: '#95e1d3', social: '#f38181', ambitious: '#f7d794', curious: '#778beb' };
            
            Object.entries(psychScores).forEach(([trait, score]) => {
                const nodeId = `psych_${trait}`;
                
                graphData.nodes.push({
                    id: nodeId,
                    label: trait.charAt(0).toUpperCase() + trait.slice(1),
                    type: 'psych',
                    value: Math.min(score * 2, 35),
                    color: psychColors[trait] || '#888'
                });
                
                graphData.links.push({
                    source: 'center',
                    target: nodeId,
                    value: score
                });
            });
        }
        
        function renderBrainMap() {
            const svg = d3.select('#brainmap');
            svg.selectAll('*').remove();
            
            const width = svg.node().getBoundingClientRect().width || 1200;
            const height = 600;
            
            svg.attr('viewBox', [0, 0, width, height]);
            
            // Create force simulation
            simulation = d3.forceSimulation(graphData.nodes)
                .force('charge', d3.forceManyBody().strength(-200))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(100))
                .force('collide', d3.forceCollide().radius(d => d.value + 10))
                .on('tick', ticked);
            
            // Draw links
            const links = svg.append('g')
                .selectAll('line')
                .data(graphData.links)
                .join('line')
                .attr('class', 'link')
                .attr('stroke', d => {
                    const sourceNode = graphData.nodes.find(n => n.id === d.source.id || n.id === d.source);
                    return sourceNode?.color || '#ffffff';
                })
                .attr('stroke-width', d => Math.sqrt(d.value) * 0.5);
            
            // Draw nodes
            const nodes = svg.append('g')
                .selectAll('circle')
                .data(graphData.nodes)
                .join('circle')
                .attr('r', d => d.value)
                .attr('fill', d => d.color || '#888')
                .attr('opacity', 0.8)
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .call(drag(simulation));
            
            // Add tooltips
            nodes.on('mouseover', function(event, d) {
                const tooltip = d3.select('#tooltip');
                let content = `<strong>${d.label}</strong><br/>`;
                
                if (d.type === 'center') {
                    content += 'Core identity hub';
                } else if (d.type === 'theme') {
                    content += `Primary interest area<br/>Strength: ${d.value}`;
                } else if (d.type === 'concept') {
                    content += `Key concept<br/>Frequency: ${d.value}`;
                } else if (d.type === 'psych') {
                    content += `Psychological trait<br/>Indicator strength: ${d.value}`;
                }
                
                tooltip.html(content)
                    .style('opacity', 1)
                    .style('left', (event.pageX + 15) + 'px')
                    .style('top', (event.pageY - 10) + 'px');
            })
            .on('mouseout', function() {
                d3.select('#tooltip').style('opacity', 0);
            });
            
            // Add labels for larger nodes
            const labels = svg.append('g')
                .selectAll('text')
                .data(graphData.nodes.filter(d => d.value > 12))
                .join('text')
                .attr('class', 'node-label')
                .attr('text-anchor', 'middle')
                .attr('dy', 4)
                .text(d => d.label.length > 15 ? d.label.substring(0, 13) + '...' : d.label);
            
            function ticked() {
                links
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                nodes
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);
                
                labels
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            }
        }
        
        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }
            
            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }
            
            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
            
            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }
        
        function updateStats(sourceCount, conceptCount, themeCount, psychScores) {
            document.getElementById('statsBar').style.display = 'flex';
            document.getElementById('statSources').textContent = sourceCount;
            document.getElementById('statConcepts').textContent = conceptCount;
            document.getElementById('statThemes').textContent = themeCount;
            
            // Find dominant psychological trait
            const dominant = Object.entries(psychScores).sort((a, b) => b[1] - a[1])[0];
            if (dominant) {
                const total = Object.values(psychScores).reduce((a, b) => a + b, 0);
                const percentage = Math.round((dominant[1] / total) * 100);
                document.getElementById('statPsych').textContent = `${dominant[0].charAt(0).toUpperCase() + dominant[0].slice(1)} (${percentage}%)`;
            } else {
                document.getElementById('statPsych').textContent = 'N/A';
            }
        }
        
        function updateInsights(concepts, themes, psychScores, wordFreq) {
            document.getElementById('insightsPanel').style.display = 'grid';
            
            // Interests
            const interestsList = document.getElementById('interestsList');
            interestsList.innerHTML = concepts.slice(0, 8).map(([concept, freq]) => 
                `<li><strong>${concept}</strong> - appears ${freq} times</li>`
            ).join('');
            
            // Themes
            const themesList = document.getElementById('themesList');
            themesList.innerHTML = Object.entries(themes)
                .sort((a, b) => b[1] - a[1])
                .map(([theme, score]) => 
                    `<span class="tag" style="background: ${getThemeColor(theme)}20; color: ${getThemeColor(theme)}">${theme} (${score})</span>`
                ).join('');
            
            // Psychological indicators
            const psychList = document.getElementById('psychList');
            const psychDescriptions = {
                analytical: 'Shows strong analytical and logical thinking patterns',
                creative: 'Displays creative and imaginative thought processes',
                practical: 'Demonstrates practical, action-oriented mindset',
                social: 'Indicates strong social and collaborative tendencies',
                ambitious: 'Reveals ambitious, goal-driven personality traits',
                curious: 'Shows high curiosity and desire to learn'
            };
            
            psychList.innerHTML = Object.entries(psychScores)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 4)
                .map(([trait, score]) => 
                    `<li><strong>${trait.charAt(0).toUpperCase() + trait.slice(1)}:</strong> ${psychDescriptions[trait]}</li>`
                ).join('');
            
            // Content patterns
            const patternsList = document.getElementById('patternsList');
            const totalWords = Object.values(wordFreq).reduce((a, b) => a + b, 0);
            const uniqueWords = Object.keys(wordFreq).length;
            const avgWordLength = allText.split(/\W+/).filter(w => w.length > 0).reduce((sum, w) => sum + w.length, 0) / (allText.split(/\W+/).filter(w => w.length > 0).length || 1);
            
            patternsList.innerHTML = `
                <li><strong>Vocabulary richness:</strong> ${uniqueWords} unique words</li>
                <li><strong>Average word length:</strong> ${avgWordLength.toFixed(1)} characters</li>
                <li><strong>Content depth:</strong> ${(allText.length / 1000).toFixed(1)}K characters analyzed</li>
                <li><strong>Dominant topics:</strong> ${Object.keys(themes).join(', ') || 'General'}</li>
            `;
        }
        
        function getThemeColor(theme) {
            const colors = { technology: '#00d9ff', science: '#00ff88', business: '#ffd93d', health: '#ff6b6b', arts: '#ff85c0', society: '#a855f7' };
            return colors[theme] || '#888';
        }
        
        function updateSourceList() {
            const sourceList = document.getElementById('sourceList');
            if (sources.length === 0) {
                sourceList.textContent = '';
            } else {
                sourceList.innerHTML = '<strong>Sources loaded:</strong> ' + 
                    sources.map(s => `<span class="tag">${s.type === 'url' ? '🌐' : '📄'} ${s.title}</span>`).join('');
            }
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function clearAll() {
            sources = [];
            allText = '';
            graphData = { nodes: [], links: [] };
            
            document.getElementById('sourceList').textContent = '';
            document.getElementById('statsBar').style.display = 'none';
            document.getElementById('insightsPanel').style.display = 'none';
            
            d3.select('#brainmap').selectAll('*').remove();
        }
        
        // Initialize with empty visualization
        window.addEventListener('load', () => {
            const svg = d3.select('#brainmap');
            const width = svg.node().getBoundingClientRect().width || 1200;
            const height = 600;
            
            svg.attr('viewBox', [0, 0, width, height]);
            
            // Add placeholder text
            svg.append('text')
                .attr('x', width / 2)
                .attr('y', height / 2)
                .attr('text-anchor', 'middle')
                .attr('fill', '#666')
                .attr('font-size', '18px')
                .text('Add URLs or upload PDFs to generate your brain map');
        });
    </script>
</body>
</html>
